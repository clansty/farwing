name: Arch

on:
  push:
    branches: [main, linux-port, clansty]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    # Arch 容器里打，才能拿到跟用户一致的 makepkg 与系统库版本。
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # 必须先装 git 再 checkout：archlinux 镜像里没有 git 时，actions/checkout
      # 会退回下载源码 tarball，工作区没有 .git；pkgver() 里的 git describe /
      # rev-parse 全部失败，版本号会变成 .r0.gnogit，每次构建都一样。
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rust clang cmake nasm git pkgconf sudo

      - uses: actions/checkout@v7
        with:
          # pkgver() 靠 `git describe --exact-match` 判断是不是在 tag 上：
          # 浅克隆既没有 tag 也没有历史，版本号会退化成 .r<0>.g<hash>。
          fetch-depth: 0
          fetch-tags: true

      - name: Build package
        run: |
          # makepkg 拒绝以 root 运行，容器里又只有 root，所以另起一个构建用户。
          # --syncdeps 用它的 sudo 去装 PKGBUILD 里列出的 depends/makedepends。
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder .
          sudo -u builder env OPENUUYC_LOCAL_SRC="$PWD" ./packaging/arch/build.sh --syncdeps --noconfirm

      - name: Check the version number
        # 包名里带 .gnogit 说明工作区不是 git 仓库；tag 上还带 .r<提交数>.g<hash> 说明
        # 当前提交没被认成 tag。两种都会让装完 pacman 查到的版本与 release 描述对不上
        # （#1 修的就是这条），所以宁可让 CI 红掉，也别把这种包静默挂上去。
        run: |
          ls target/arch/*.pkg.tar.zst
          case "$(ls target/arch/*.pkg.tar.zst)" in *gnogit*)
            echo "::error::工作区不是 git 仓库，版本号退化成 .gnogit"; exit 1 ;;
          esac
          # 分支上版本号本来就该带 .r<提交数>.g<hash>，只有 tag 上必须干净。
          case "$GITHUB_REF" in refs/tags/v*)
            if ls target/arch/*.pkg.tar.zst | grep -qE '\.r[0-9]+\.g'; then
              echo "::error::当前提交没被认成 tag，版本号带上了 .r<提交数>.g<hash>"
              exit 1
            fi ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: openuuyc-arch
          path: |
            target/arch/*.pkg.tar.zst
            target/arch/*.pkg.tar.zst.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: openuuyc-arch
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.pkg.tar.zst
            *.pkg.tar.zst.sha256
